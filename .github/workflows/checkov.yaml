name: Checkov Security Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          skip_path: terraform/modules/db
          # global, not inline: checkov's inline skip comments are unreliable (known bugs)
          skip_check: CKV_AWS_144,CKV_AWS_119,CKV_AWS_356,CKV_AWS_108,CKV_AWS_111,CKV_AWS_145,CKV_AWS_358
          quiet: true
          compact: true
          output_format: cli
          soft_fail: false